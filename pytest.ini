[pytest]
# Discover tests in the tests/ directory
testpaths = tests

# asyncio mode: auto — no need to mark every async test manually
asyncio_mode = auto

# Short traceback for cleaner output
addopts = -v --tb=short

# Test layers (see docs/testing-strategy.md).
# PR CI runs everything except e2e/slow/perf/smoke; the nightly job runs those.
markers =
    contract: schema, import, config and unit-file contracts
    property: hypothesis property-based tests
    integration: multi-component tests on fakeredis
    e2e: full trading-day market simulation
    slow: long-running tests
    perf: performance and soak tests
    smoke: live-server checks (manual only, requires SSH)

# Treat these warnings as errors so we catch issues early
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:telegram.*
    ignore::DeprecationWarning:anyio.*
    ignore::DeprecationWarning:pytest_asyncio.*
